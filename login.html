
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixMent - Login</title>

    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="painel">

        <img src="../assets/icons/logo.png" alt="Logo MixMent" class="logo">

        <h2>Login</h2>

        <form>
            <div class="form__group">

                <input
                    type="text"
                    class="form__input"
                    id="name"
                    placeholder="Usuário ou E-mail"
                    required
                />
                <label for="name" class="form__label">Usuário ou E-mail</label>

                <input
                    type="password"
                    class="form__input"
                    id="password"
                    placeholder="Senha"
                    required
                />
                <label for="password" class="form__label">Senha</label>

            </div>

            <button type="submit" class="botao-login">Entrar</button>
        </form>

    </main>

</body>
</html>
